<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZORA Ads</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #050505;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            width: 92%;
            max-width: 420px;

            padding: 30px 22px;

            text-align: center;

            background: #111;
            border: 1px solid #252525;
            border-radius: 22px;

            box-shadow: 0 15px 50px rgba(0,0,0,.5);
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #087cff,
                #00d9ff
            );

            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .description {
            color: #999;
            margin: 10px 0 25px;
        }

        .watch-button {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 13px;

            background: white;
            color: black;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .watch-button:hover {
            opacity: .9;
        }

        .watch-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .stats {
            margin-top: 22px;

            padding: 18px;

            background: #191919;
            border-radius: 15px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .label {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        #status {
            min-height: 20px;
            margin-top: 15px;

            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Z
    </div>

    <h1>ZORA</h1>

    <p class="description">
        Watch an advertisement to support ZORA
    </p>

    <button
        id="watchAdButton"
        class="watch-button"
        onclick="watchAd()">

        Watch Ad

    </button>

    <div class="stats">

        <div
            id="adCount"
            class="number">
            0
        </div>

        <div class="label">
            Ads Started
        </div>

    </div>

    <div id="status">
        Ready
    </div>

</div>


<!-- =====================================================
     MONETAG CODE
     
     >>> PASTE YOUR MONETAG CODE HERE <<<
     
     Example:
     <script src="YOUR MONETAG SCRIPT"></script>

     ===================================================== -->

<!-- MONETAG_CODE_HERE -->


<script>

    /*
     * ==========================================
     * ZORA AD SYSTEM
     * ==========================================
     */

    const button =
        document.getElementById("watchAdButton");

    const counter =
        document.getElementById("adCount");

    const status =
        document.getElementById("status");


    /*
     * Load previous counter
     */

    let adCount =
        Number(
            localStorage.getItem("zora_ad_count") || 0
        );

    counter.textContent = adCount;


    /*
     * Watch Ad
     */

    async function watchAd() {

        button.disabled = true;

        status.textContent =
            "Opening advertisement...";


        try {

            /*
             * ==========================================
             * MONETAG FUNCTION
             *
             * >>> IF MONETAG GIVES YOU A FUNCTION NAME,
             * >>> PUT IT HERE.
             *
             * Example:
             *
             * await show_11982192();
             *
             * ==========================================
             */

            // MONETAG_FUNCTION_HERE


            /*
             * Count the user's ad start
             */

            adCount++;

            localStorage.setItem(
                "zora_ad_count",
                adCount
            );

            counter.textContent =
                adCount;


            status.textContent =
                "Advertisement opened.";

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "Advertisement could not be opened.";

        }


        /*
         * Enable button again after a short delay.
         * User can choose to watch another ad.
         */

        setTimeout(function () {

            button.disabled = false;

            status.textContent =
                "Ready";

        }, 2000);

    }

</script>

</body>
</html>
